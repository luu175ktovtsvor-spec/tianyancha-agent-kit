<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent 获客流 &amp; 天眼查</title>
  <desc id="desc">任务负责人告诉 Agent 行业与筛选要求。Agent 建立任务配置并打开可见浏览器；任务负责人扫码登录后，Agent 采集结果、筛选并导入飞书。</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf5ff"/><stop offset=".55" stop-color="#f8fbff"/><stop offset="1" stop-color="#eefaf7"/></linearGradient>
    <linearGradient id="ink" x1="0" x2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#145b71"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f0a84b"/><stop offset=".48" stop-color="#45b7c9"/><stop offset="1" stop-color="#4c8df6"/></linearGradient>
    <linearGradient id="engine" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14395c"/><stop offset="1" stop-color="#0e7c86"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17324d" flood-opacity=".11"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4c8df6"/></marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .eyebrow { font-size: 14px; letter-spacing: 2.8px; font-weight: 700; fill: #2d6b83; }
      .headline { font-size: 48px; font-weight: 700; fill: #102a43; }
      .sub { font-size: 18px; fill: #5d7388; }
      .node-label { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; fill: #618099; }
      .node-title { font-size: 25px; font-weight: 700; fill: #102a43; }
      .node-copy { font-size: 16px; fill: #60778e; }
      .chip { font-size: 13px; font-weight: 600; fill: #34536c; }
      .white-title { font-size: 24px; font-weight: 700; fill: #fff; }
      .white-copy { font-size: 14px; fill: #dff7f8; }
      .tiny { font-size: 13px; fill: #66849a; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="url(#page)"/>
  <circle cx="1300" cy="118" r="170" fill="#b7e8e1" opacity=".33" filter="url(#soft)"/>
  <circle cx="184" cy="668" r="150" fill="#c4ddff" opacity=".42" filter="url(#soft)"/>
  <rect x="44" y="40" width="1352" height="680" rx="34" fill="#fff" opacity=".94" filter="url(#shadow)"/>

  <text x="102" y="112" class="sans eyebrow">AGENT WORKFLOW</text>
  <text x="98" y="172" class="sans headline">告诉 Agent 需求，跑出获客线索</text>
  <text x="102" y="210" class="sans sub">行业不同，改配置；流程相同，Agent 负责执行</text>
  <rect x="102" y="239" width="86" height="5" rx="2.5" fill="#efad50"/>
  <rect x="196" y="239" width="58" height="5" rx="2.5" fill="#53b9c8"/>
  <rect x="262" y="239" width="42" height="5" rx="2.5" fill="#4c8df6"/>

  <path d="M260 436C400 360 521 366 646 435C765 501 900 505 1037 435" fill="none" stroke="url(#flow)" stroke-width="9" stroke-linecap="round" opacity=".92"/>
  <path d="M1042 435H1136" fill="none" stroke="#4c8df6" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="260" cy="436" r="12" fill="#f0a84b" stroke="#fff" stroke-width="5"/>
  <circle cx="646" cy="435" r="12" fill="#45b7c9" stroke="#fff" stroke-width="5"/>
  <circle cx="1037" cy="435" r="12" fill="#4c8df6" stroke="#fff" stroke-width="5"/>

  <g transform="translate(112 322)">
    <text x="0" y="0" class="sans node-label">任务需求</text>
    <text x="0" y="43" class="sans node-title">告诉 Agent 什么</text>
    <text x="0" y="75" class="sans node-copy">行业、保留词、排除词、地区、电话</text>
    <g transform="translate(0 107)">
      <rect width="176" height="34" rx="17" fill="#fff4dd"/>
      <circle cx="17" cy="17" r="5" fill="#e89e31"/>
      <text x="31" y="22" class="sans chip">页面字段和选择器</text>
    </g>
    <g transform="translate(0 152)">
      <rect width="204" height="34" rx="17" fill="#eef7ff"/>
      <circle cx="17" cy="17" r="5" fill="#4c8df6"/>
      <text x="31" y="22" class="sans chip">主体、风险和入库要求</text>
    </g>
  </g>

  <g transform="translate(517 312)">
    <circle cx="132" cy="132" r="121" fill="url(#engine)" filter="url(#shadow)"/>
    <circle cx="132" cy="132" r="94" fill="none" stroke="#88d8d7" stroke-opacity=".42" stroke-width="1.5"/>
    <circle cx="132" cy="132" r="62" fill="#fff" fill-opacity=".10"/>
    <path d="M99 115h66M99 133h66M99 151h66" stroke="#dfffff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <text x="132" y="83" text-anchor="middle" class="sans white-title">Agent 执行</text>
    <text x="132" y="184" text-anchor="middle" class="sans white-copy">改配置 · 开浏览器</text>
    <text x="132" y="205" text-anchor="middle" class="sans white-copy">扫码后采集 · 筛选 · 分流</text>
  </g>

  <g transform="translate(954 322)">
    <text x="0" y="0" class="sans node-label">结果</text>
    <text x="0" y="43" class="sans node-title">获客线索和飞书</text>
    <text x="0" y="75" class="sans node-copy">一条电话即可进入线索流程</text>
    <g transform="translate(0 107)">
      <rect width="108" height="34" rx="17" fill="#eaf2ff"/><text x="19" y="22" class="sans chip">获客主表</text>
      <rect x="118" width="108" height="34" rx="17" fill="#e7f8f4"/><text x="137" y="22" class="sans chip">主体分表</text>
      <rect x="236" width="108" height="34" rx="17" fill="#f4efff"/><text x="255" y="22" class="sans chip">淘汰审计</text>
    </g>
    <g transform="translate(0 168)">
      <rect width="229" height="43" rx="21" fill="#f8fbfd" stroke="#c8d8e5" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="21" y="27" class="sans chip">飞书导入 / 任务适配器</text>
    </g>
  </g>

  <path d="M108 630H1332" stroke="#e2ebf3" stroke-width="1.5"/>
  <text x="108" y="670" class="sans tiny">公开仓库：浏览器自动化、筛选、分表和审计</text>
  <text x="948" y="670" class="sans tiny">任务工作区：行业规则、选择器、数据和外部系统配置</text>
</svg>
